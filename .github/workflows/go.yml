name: Go CI

on:
  push:
    # Temporary trusted-branch trigger; remove before merging Phase 2.
    branches: [main, release/edge-ci-validation]
  pull_request:

jobs:
  dockerhub-publish:
    needs: [fmt, test, test-race]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'OneBusAway/maglev' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/release/edge-ci-validation')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dockerhub-maglev-main-publication
      cancel-in-progress: false
    env:
      IMAGE: opentransitsoftwarefoundation/maglev
      # Temporary test channel; remove branch handling before merging Phase 2.
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'main' || 'main-test' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long,priority=300
            type=raw,value=${{ env.CHANNEL }}
          labels: |
            org.opencontainers.image.title=Maglev
            org.opencontainers.image.description=REST API server for OneBusAway transit data
            org.opencontainers.image.documentation=https://github.com/OneBusAway/maglev/wiki
            org.opencontainers.image.licenses=Apache-2.0
            org.onebusaway.maglev.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=min
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILD_TIME=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.metadata.outputs.version }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.repository == 'OneBusAway/maglev'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check go fmt
        run: |
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "To fix, run locally: go fmt ./..."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      SONAR_CI_ANALYSIS_ENABLED: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check OpenAPI spec is up to date with upstream
        if: github.event_name == 'pull_request'
        run: bash scripts/check-openapi.sh
        shell: bash

      - name: Run tests (fast mode)
        run: go test -v -tags='sqlite_fts5 sqlite_math_functions' -coverprofile=profile.cov -timeout 40m ./...
        env:
          CGO_ENABLED: 1
        shell: bash

      - name: Enforce Coverage Threshold
        run: |
          # Strip ALL auto-generated SQL code and test mocks from coverage math
          grep -v "query.sql.go" profile.cov | grep -v "gtfsdb/db.go" | grep -v "gtfsdb/models.go" | grep -v "_mock.go" > clean_profile.cov

          COVERAGE=$(go tool cover -func=clean_profile.cov | grep total: | grep -Eo '[0-9]+\.?[0-9]*')
          echo "Current Test Coverage is: $COVERAGE%"

          if [ -z "$COVERAGE" ]; then
            echo "ERROR: Could not parse coverage percentage"
            exit 1
          fi

          if [ "$(echo "$COVERAGE 75.0" | awk '{print ($1 < $2)}')" = "1" ]; then
            echo "Coverage dropped below 75% threshold!"
            exit 1
          fi
        shell: bash

      - name: SonarQube Scan
        if: github.repository == 'OneBusAway/maglev' && env.SONAR_CI_ANALYSIS_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-race:
    name: Race Detector (Targeted)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run race detector on concurrent packages
        run: go test -race -v -tags='sqlite_fts5 sqlite_math_functions' -timeout 20m ./internal/gtfs/...
        shell: bash
