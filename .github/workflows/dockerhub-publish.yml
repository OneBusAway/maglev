name: Docker Hub publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dockerhub-publish:
    # Forks may run their own CI, but must not attempt upstream publication.
    if: github.repository == 'OneBusAway/maglev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dockerhub-maglev-main-publication
      cancel-in-progress: false
    env:
      IMAGE: opentransitsoftwarefoundation/maglev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long,priority=300
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=Maglev
            org.opencontainers.image.description=REST API server for OneBusAway transit data
            org.opencontainers.image.documentation=https://github.com/OneBusAway/maglev/wiki
            org.opencontainers.image.licenses=Apache-2.0
            org.onebusaway.maglev.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=min
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILD_TIME=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.metadata.outputs.version }}
