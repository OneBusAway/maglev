name: Docker build and publish

on:
  push:
    # Temporary native-runner publication test; remove before merging.
    branches: [main, release/edge-ci-validation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dockerhub-maglev-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: opentransitsoftwarefoundation/maglev

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      labels: ${{ steps.metadata.outputs.labels }}
      json: ${{ steps.metadata.outputs.json }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=sha,format=long
          labels: |
            org.opencontainers.image.title=Maglev
            org.opencontainers.image.description=REST API server for OneBusAway transit data
            org.opencontainers.image.documentation=https://github.com/OneBusAway/maglev/wiki
            org.opencontainers.image.licenses=Apache-2.0
            org.onebusaway.maglev.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  build:
    name: Build (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/edge-ci-validation') &&
          github.repository == 'OneBusAway/maglev'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/edge-ci-validation') && github.repository == 'OneBusAway/maglev' }}
          sbom: true
          provenance: mode=min
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ fromJSON(needs.metadata.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILD_TIME=${{ fromJSON(needs.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ needs.metadata.outputs.version }}

      - name: Export digest
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/edge-ci-validation') &&
          github.repository == 'OneBusAway/maglev'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/edge-ci-validation') &&
          github.repository == 'OneBusAway/maglev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-architecture image
    needs: [metadata, build]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/edge-ci-validation') &&
      github.repository == 'OneBusAway/maglev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ needs.metadata.outputs.tags }}
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$TAG" "${sources[@]}"
